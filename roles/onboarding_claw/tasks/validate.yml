---
- name: Validate scalar onboarding fields
  ansible.builtin.assert:
    that:
      - claw_output_dir | length > 0
      - claw_output_dir is ansible.builtin.abs
      - employee_id is match('^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$')
      - role in supported_roles
      - communication_style in supported_styles
      - day_start is match('^(?:[01][0-9]|2[0-3]):[0-5][0-9]$')
      - timezone | length > 0
      - brief_lead_minutes | int >= 0
      - brief_lead_minutes | int <= 1440
      - claw_catalog_version is match('^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$')
    fail_msg: Onboarding contains an invalid required field.
  no_log: true

- name: Validate list onboarding fields
  ansible.builtin.assert:
    that:
      - current_focus is sequence
      - current_focus is not string
      - key_contacts is sequence
      - key_contacts is not string
      - connectors is sequence
      - connectors is not string
      - working_days | length > 0
      - working_days | unique | length == working_days | length
      - working_days | difference(['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat']) | length == 0
      - connectors | difference(supported_connectors) | length == 0
      - connectors | unique | length == connectors | length
      - current_focus | length <= 25
      - key_contacts | length <= 100
    fail_msg: Onboarding contains an invalid list or unsupported value.
  no_log: true

- name: Validate focus entries
  ansible.builtin.assert:
    that:
      - item is string
      - item | trim | length > 0
      - item | length <= 500
    fail_msg: Every current-focus entry must contain 1 to 500 characters.
  loop: "{{ current_focus }}"
  no_log: true

- name: Validate key contacts
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.directory_id | default('') | length > 0
      - item.display_name | default('') | trim | length > 0
      - item.email | default('') is match('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
    fail_msg: Every key contact requires a directory ID, display name, and valid email address.
  loop: "{{ key_contacts }}"
  no_log: true

- name: Inspect requested output path
  ansible.builtin.stat:
    path: "{{ claw_output_dir }}"
  register: claw_output_stat

- name: Find existing output content
  ansible.builtin.find:
    paths: "{{ claw_output_dir }}"
    hidden: true
    recurse: false
    file_type: any
  register: claw_existing_content
  when: claw_output_stat.stat.exists and claw_output_stat.stat.isdir

- name: Refuse unsafe output targets
  ansible.builtin.assert:
    that:
      - claw_output_dir not in ['/', '/home', '/tmp', '/var', '/opt']
      - >-
        not (claw_output_dir | ansible.builtin.realpath).startswith(
          (playbook_dir | dirname | ansible.builtin.realpath) + '/')
      - not claw_output_stat.stat.exists or claw_output_stat.stat.isdir
      - not claw_output_stat.stat.exists or claw_existing_content.matched == 0
    fail_msg: The output directory must be absent or an empty dedicated directory.
